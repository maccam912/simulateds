name: Build, test, and publish releases

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep each main commit's build queued even when a newer commit is pushed.
  group: build-${{ github.ref }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: windows
            os: windows-2022
          - platform: macos
            # ARM hosted jobs repeatedly expired before acquiring a runner.
            # Build both CPU slices on the standard Intel runner.
            os: macos-15-intel
          - platform: android
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify binary asset storage
        run: python tools/check_assets.py
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/iroh/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', 'native/iroh/Cargo.lock') }}
      - uses: actions/cache@v4
        with:
          path: .tools
          key: godot-archives-v2-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('tools/versions.json') }}
      - name: Rust checks
        if: matrix.platform == 'linux'
        run: |
          cargo fmt --manifest-path native/iroh/Cargo.toml --check
          cargo clippy --locked --manifest-path native/iroh/Cargo.toml -- -D warnings
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK and NDK
        if: matrix.platform == 'android'
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.1' 'ndk;28.1.13356709'
      - name: Build native host extension
        run: python tools/build_native.py
      - name: Import and test host plus two clients
        run: python tools/check.py
      - name: Build Android extension
        if: matrix.platform == 'android'
        run: python tools/build_native.py android
      - name: Export game
        run: python tools/export.py ${{ matrix.platform }} --skip-build
      - name: Export dedicated server
        if: matrix.platform == 'linux'
        run: python tools/export.py server --skip-build
      - name: Trim extracted export templates before caching
        if: always()
        run: python tools/trim_ci_cache.py
      - name: Upload games
        uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.platform }}
          path: build/artifacts/*
          if-no-files-found: error
      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native/bin/*
          if-no-files-found: error
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.platform }}
          path: |
            build/checks/*.log
            build/smoke/*.log
            build/*_peer/*.log
          if-no-files-found: ignore

  release:
    name: Publish release
    if: github.event_name == 'push' && !github.event.deleted && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: game-*
          merge-multiple: true
          path: release
      - name: Publish release assets
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check --strict simulateds-{android.apk,linux.zip,macos.zip,server.zip,windows.zip}.sha256

          tag="$GITHUB_REF_NAME"
          title="$tag"
          flags=()
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tag="dev-$GITHUB_SHA"
            title="Development Build $GITHUB_RUN_NUMBER"
            flags+=(--prerelease)
            git push origin "$GITHUB_SHA:refs/tags/$tag"

            # A rerun can finish an interrupted draft or skip a published release.
            if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
              if [[ "$draft" == true ]]; then
                gh release upload "$tag" simulateds-* --clobber
                gh release edit "$tag" --draft=false --prerelease
              fi
              exit 0
            fi
          fi

          gh release create "$tag" simulateds-* --verify-tag --generate-notes --title "$title" "${flags[@]}"
